name: Checks

on:
  workflow_call:
    inputs:
      rust:
        type: string
        required: true
      matrix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ inputs.rust }}
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --check

  native:
    name: Test ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          # Select the native host explicitly, particularly on Windows ARM64.
          toolchain: ${{ inputs.rust }}-${{ matrix.host }}
          components: clippy
      - name: Confirm native toolchain
        env:
          EXPECTED_HOST: ${{ matrix.host }}
        run: |
          rustc -vV
          test "$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')" = "$EXPECTED_HOST"
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
