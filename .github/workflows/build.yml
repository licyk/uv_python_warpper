name: Build

on:
  workflow_call:
    inputs:
      rust:
        type: string
        required: true
      matrix:
        type: string
        required: true

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ inputs.rust }}-${{ matrix.host }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Install musl linker
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          key="CARGO_TARGET_$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')_LINKER"
          echo "$key=musl-gcc" >> "$GITHUB_ENV"
      - name: Build both programs
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --bins --target "$TARGET"
      - name: Package and test the extracted release with real uv and Python
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python scripts/ci.py package --target "$TARGET"
          python scripts/ci.py smoke --target "$TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  collect:
    name: Verify all release packages
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/
      - name: Check platform coverage and generate checksums
        run: python scripts/ci.py manifest
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          overwrite: true
          retention-days: 7
