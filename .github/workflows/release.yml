name: Release

# Publishing never starts its own checks or builds. Only CI calls this workflow,
# after all checks and all eight packages have succeeded in the same run.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      tag:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: github-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: dist/
      - name: Verify and publish the already built packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: python scripts/ci.py publish
